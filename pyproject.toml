[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"

[project]
name = "adaptive-microservices-autoscaling"
version = "0.1.0"
description = "Predictive and reactive auto-scaling simulation using FastAPI microservices"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "sqlalchemy>=2.0.30",
  "pydantic>=2.7.0",
  "scikit-learn>=1.4.0",
  "statsmodels>=0.14.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "matplotlib>=3.8.0",
  "streamlit>=1.35.0",
  "streamlit-autorefresh>=1.0.1",
  "plotly>=5.22.0"
]

[tool.setuptools]
packages = ["shared", "service_app", "monitoring_service", "gateway_service", "prediction_engine", "autoscaling_controller", "evaluation_module", "load_generator"]
